name: NSE Watchlist Slack Summary

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel watchlist cron
        env:
          CRON_SECRET: ${{ secrets.NSE_WATCHLIST_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing NSE_WATCHLIST_CRON_SECRET repository secret"
            exit 1
          fi

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 20 \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pm-vibe-portfolio.vercel.app/api/cron/nse-watchlist-slack"
